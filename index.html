<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mercura 3D Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Manrope:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one dark stage — the liquid ring in the center, the wordmark under it, a thin spec strip at the bottom. */
:root{
  --bg:#07070c; --bg2:#10101a; --fg:#ecebf5; --muted:#8a89a3; --line:#23233a;
  --i1:#7ef9ff; --i2:#b48cff; --i3:#ff8ad8; --i4:#ffd27a;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 35%,var(--bg2) 0%,var(--bg) 60%);background-color:var(--bg);color:var(--fg);font-family:var(--body);overflow-x:hidden}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:24px 20px;box-sizing:border-box;gap:8px}
#stage{width:min(560px,100%);aspect-ratio:1/1;max-width:100%;cursor:grab;touch-action:none;display:block}
#stage:active{cursor:grabbing}
.word{font-family:var(--display);font-weight:500;font-size:clamp(34px,8vw,72px);letter-spacing:.22em;margin:-28px 0 0;padding-left:.22em;text-transform:uppercase;
  background:linear-gradient(100deg,var(--i1),var(--i2) 30%,var(--i3) 55%,var(--i4) 75%,var(--i1));background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 9s linear infinite;text-wrap:balance;text-align:center}
@keyframes sheen{to{background-position:-250% 0}}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:0;text-align:center}
.hint{font-size:13px;color:var(--muted);margin:14px 0 0;text-align:center}
.spec{margin-top:auto;padding-top:28px;display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip{display:flex;align-items:center;gap:8px}
.chip i{width:12px;height:12px;border-radius:50%;display:block}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.controls button{font:500 12px var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.controls button[aria-pressed="true"]{border-color:var(--i2);background:rgba(180,140,255,.12)}
.controls button:focus-visible{outline:2px solid var(--i1);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.word{animation:none}}
</style>

<div class="wrap">
  <canvas id="stage" aria-label="Трёхмерный логотип Mercura: переливающееся жидкое кольцо"></canvas>
  <h1 class="word">Mercura</h1>
  <p class="tag">liquid web studio</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,0.1,100);
camera.position.set(0,0,7.2);

const noise=`
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;
vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
i=mod289(i);vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;
return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}`;

const vert=noise+`
uniform float uTime; uniform float uAmp; uniform float uFreq;
varying vec3 vN; varying vec3 vPos; varying float vD;
float disp(vec3 p){
  float n=snoise(p*uFreq+vec3(uTime*.35,uTime*.22,-uTime*.28));
  n+=.45*snoise(p*uFreq*2.1-vec3(uTime*.5));
  return n*uAmp;
}
void main(){
  vec3 n=normalize(normal);
  vec3 t=normalize(cross(n,abs(n.y)>.95?vec3(1.,0.,0.):vec3(0.,1.,0.)));
  vec3 b=normalize(cross(n,t));
  float e=.012;
  vec3 p=position+n*disp(position);
  vec3 pt=position+t*e; pt+=n*disp(pt);
  vec3 pb=position+b*e; pb+=n*disp(pb);
  vec3 nn=normalize(cross(pt-p,pb-p));
  if(dot(nn,n)<0.) nn=-nn;
  vD=disp(position);
  vN=normalize(normalMatrix*nn);
  vec4 mv=modelViewMatrix*vec4(p,1.);
  vPos=mv.xyz;
  gl_Position=projectionMatrix*mv;
}`;

const frag=`
uniform float uTime; uniform vec3 uA; uniform vec3 uB; uniform vec3 uC; uniform vec3 uDd; uniform float uMetal;
varying vec3 vN; varying vec3 vPos; varying float vD;
vec3 pal(float t){return uA+uB*cos(6.28318*(uC*t+uDd));}
void main(){
  vec3 N=normalize(vN); vec3 V=normalize(-vPos);
  float fr=pow(1.-max(dot(N,V),0.),2.2);
  vec3 R=reflect(-V,N);
  // fake studio environment: soft top light, dark floor, two strip lights
  float env=smoothstep(-.2,.9,R.y)*.9+.08;
  env+=smoothstep(.93,1.,abs(R.x*.8+R.y*.3))*1.4;
  env+=smoothstep(.96,1.,R.z*.6-R.x*.5)*.9;
  vec3 irid=pal(fr*1.15+dot(N,vec3(.25,.6,.3))*.55+vD*.9+uTime*.04);
  vec3 base=mix(vec3(env)*vec3(.92,.94,1.),irid*(.35+env),uMetal);
  vec3 col=mix(base,irid*1.25,fr*.85);
  vec3 L=normalize(vec3(.6,.8,.7));
  float spec=pow(max(dot(reflect(-L,N),V),0.),90.)*1.6;
  col+=spec;
  col=col/(1.+col*.18);
  gl_FragColor=vec4(pow(col,vec3(.92)),1.);
}`;

const palettes=[
  {a:[.55,.55,.62],b:[.45,.42,.4],c:[1.,1.,1.],d:[.0,.33,.67],m:1.0},  // aurora iridescent
  {a:[.62,.64,.7],b:[.3,.3,.34],c:[1.,1.,1.],d:[.55,.6,.68],m:.55},    // chrome w/ blue tint
  {a:[.62,.4,.38],b:[.45,.35,.35],c:[1.,.9,.8],d:[.0,.12,.25],m:1.0}   // ember
];
const uniforms={uTime:{value:0},uAmp:{value:.11},uFreq:{value:1.3},
  uA:{value:new THREE.Vector3()},uB:{value:new THREE.Vector3()},uC:{value:new THREE.Vector3()},uDd:{value:new THREE.Vector3()},uMetal:{value:1}};
function setPal(i){const p=palettes[i];uniforms.uA.value.fromArray(p.a);uniforms.uB.value.fromArray(p.b);uniforms.uC.value.fromArray(p.c);uniforms.uDd.value.fromArray(p.d);uniforms.uMetal.value=p.m;}
setPal(0);
const mat=new THREE.ShaderMaterial({vertexShader:vert,fragmentShader:frag,uniforms});

const group=new THREE.Group(); scene.add(group);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.25,.5,160,360),mat);
group.add(ring);
const dropU={...uniforms,uAmp:{value:.06},uFreq:{value:2.4}};
const dropMat=new THREE.ShaderMaterial({vertexShader:vert,fragmentShader:frag,uniforms:dropU});
const drop=new THREE.Mesh(new THREE.IcosahedronGeometry(.26,6),dropMat);
group.add(drop);
group.rotation.set(-.35,.5,0);

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(canvas); resize();

// interaction
let drag=false,lx=0,ly=0,vx=.0035,vy=0,hover=0,hoverT=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;vy=dx*.0009;vx=dy*.0009;group.rotation.y+=dx*.008;group.rotation.x+=dy*.008;});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointerenter',()=>hoverT=1);
canvas.addEventListener('pointerleave',()=>hoverT=0);


const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock();
function tick(){
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime*(reduce?.15:1);
  uniforms.uTime.value=t;
  hover+= (hoverT-hover)*.05;
  uniforms.uAmp.value=.11+hover*.09;
  if(!drag){ group.rotation.y+= .25*dt + vy; group.rotation.x+= Math.sin(t*.4)*.0015 + vx; vy*=.94; vx*=.94; }
  const a=t*.8;
  drop.position.set(Math.cos(a)*1.95,Math.sin(a*1.3)*.35,Math.sin(a)*1.95);
  drop.scale.setScalar(1+Math.sin(t*3.)*.08);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
})();
</script>

</body></html>
